spring:
  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/YX2_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root  # 替换为你的数据库账号
    password: Lhx20020916  # 替换为你的数据库密码
    # HikariCP 连接池配置
    hikari:
      # 连接池名称
      pool-name: YuanxiaoerHikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数（根据应用并发量调整，一般设置为 CPU 核心数*2 + 1）
      maximum-pool-size: 20
      # 连接空闲超时时间（毫秒），连接超过此时间将被释放
      idle-timeout: 600000
      # 连接超时时间（毫秒），获取连接超时将抛出异常
      connection-timeout: 30000
      # 连接最大生命周期（毫秒），建议设置为数据库等待超时的 60-70%
      max-lifetime: 1800000
      # 连接测试查询（MySQL 默认使用 SELECT 1）
      connection-test-query: SELECT 1
      # 是否启用 JMX MBean 注册（用于监控）
      register-mbeans: true
      # 连接测试超时时间（毫秒）
      validation-timeout: 5000
      # 泄漏检测阈值（毫秒），超过此时间的连接未归还将被记录警告
      leak-detection-threshold: 60000
      # 初始化完成后执行的 SQL（可选）
      # initialization-fail-timeout: -1
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 500MB
  # 解决跨域（前端访问后端需要）
  web:
    resources:
      static-locations: file:./upload/
# MyBatisPlus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted # 全局软删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.yuanxiaoer.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志（开发环境用）

# 端口配置
server:
  port: 8081
  servlet:
    context-path: /api/v1 # 全局接口前缀
    session:
      timeout: 3600s
      cookie:
        path: /api/v1
        same-site: lax
        secure: false
        http-only: true

# SpringDoc/Knife4j 配置
springdoc:
  api-docs:
    enabled: true  # 生产环境建议改为 false
    path: /v3/api-docs
  swagger-ui:
    enabled: true  # 生产环境建议改为 false
    path: /swagger-ui.html
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yuanxiaoer.yuanxiaoer

# Knife4j 配置
knife4j:
  enable: true  # 生产环境建议改为 false
  setting:
    language: zh-CN
    swagger-model-name: 实体类列表
    enable-document-manage: true
    enable-home-custom: true
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0 | Copyright &copy; 2025 Yuanxiaoer

# 生产环境配置示例（实际应用时取消注释）
# ---
# spring:
#   profiles:
#     active: prod  # 通过激活不同 profile 来控制
# 
# ---
# 或者使用条件配置：
# knife4j.production=false  # 自定义配置，配合代码逻辑控制

upload:
  # 文件上传根路径（项目根目录下upload）
  base-path: ${user.dir}/../upload/
  # 访问路径前缀
  base-url: http://localhost:8080/upload/
