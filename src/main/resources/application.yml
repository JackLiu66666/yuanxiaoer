spring:
  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 500MB
  web:
    resources:
      static-locations: file:./upload/
# MyBatisPlus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted # 全局软删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.yuanxiaoer.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志（开发环境用）

# 端口配置
server:
  port: 8081
  servlet:
    context-path: /api/v1 # 全局接口前缀
    session:
      timeout: 3600s
      cookie:
        path: /api/v1
        same-site: lax
        secure: false
        http-only: true

